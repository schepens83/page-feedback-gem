plugins:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  CacheRootDirectory: /tmp/page-feedback-rubocop-cache
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.2
  Exclude:
    - "spec/dummy/db/schema.rb"
    - "vendor/**/*"

Metrics/AbcSize:
  Exclude:
    - "db/migrate/**/*"
    - "spec/dummy/db/migrate/**/*"

Metrics/MethodLength:
  Exclude:
    - "db/migrate/**/*"
    - "spec/dummy/db/migrate/**/*"

RSpec/ExampleLength:
  Max: 10

RSpec/DescribeClass:
  Exclude:
    - "spec/docs/**/*"
    - "spec/migrations/**/*"
    - "spec/requests/**/*"

RSpec/MultipleExpectations:
  Max: 3

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Exclude:
    - "db/migrate/**/*"
    - "spec/dummy/db/migrate/**/*"
