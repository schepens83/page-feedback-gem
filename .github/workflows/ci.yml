name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.2"
            rails: "8.0"
            gemfile: gemfiles/rails_8_0.gemfile
          - ruby: "3.4"
            rails: "8.0"
            gemfile: gemfiles/rails_8_0.gemfile
          - ruby: "3.4"
            rails: "8.1"
            gemfile: gemfiles/rails_8_1.gemfile
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bundle exec rake spec
      - run: npm test
      - run: bundle exec rubocop
      - run: bundle exec rbs -I sig validate
      - run: bundle exec yard doc --fail-on-warning --no-output --exclude '^sig/'
      - run: gem build page_feedback.gemspec
